[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-analysis-agent"
version = "0.1.0"
description = "A learning project for building a reliable data analysis agent"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10,<4",
    "openai-agents>=0.22,<1",
    "pandas>=2.2,<3",
    "pydantic>=2.12,<3",
    "python-dotenv>=1.2,<2",
    "streamlit>=1.62,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
